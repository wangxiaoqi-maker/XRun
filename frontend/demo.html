<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自动化测试步骤编辑器 - 样式预览</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone (用于转换 JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    // 模拟图标 (使用 SVG 以避免依赖库)
    const Icons = {
      Drag: () => React.createElement('svg', { width: "16", height: "16", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round", className: "text-gray-300 hover:text-gray-500 cursor-grab active:cursor-grabbing" },
        React.createElement('circle', { cx: "9", cy: "12", r: "1" }),
        React.createElement('circle', { cx: "9", cy: "5", r: "1" }),
        React.createElement('circle', { cx: "9", cy: "19", r: "1" }),
        React.createElement('circle', { cx: "15", cy: "12", r: "1" }),
        React.createElement('circle', { cx: "15", cy: "5", r: "1" }),
        React.createElement('circle', { cx: "15", cy: "19", r: "1" })
      ),
      Play: () => React.createElement('svg', { width: "14", height: "14", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },
        React.createElement('polygon', { points: "5 3 19 12 5 21 5 3" })
      ),
      Trash: () => React.createElement('svg', { width: "14", height: "14", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },
        React.createElement('polyline', { points: "3 6 5 6 21 6" }),
        React.createElement('path', { d: "M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" })
      ),
      Edit: () => React.createElement('svg', { width: "14", height: "14", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },
        React.createElement('path', { d: "M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" }),
        React.createElement('path', { d: "M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" })
      ),
      Plus: () => React.createElement('svg', { width: "16", height: "16", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },
        React.createElement('line', { x1: "12", y1: "5", x2: "12", y2: "19" }),
        React.createElement('line', { x1: "5", y1: "12", x2: "19", y2: "12" })
      ),
      Check: () => React.createElement('svg', { width: "16", height: "16", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "3", strokeLinecap: "round", strokeLinejoin: "round" },
        React.createElement('polyline', { points: "20 6 9 17 4 12" })
      )
    };

    // 定义动作类型和对应的颜色样式
    const ACTION_STYLES = {
      click: { label: '点击', bg: 'bg-blue-50', text: 'text-blue-600', border: 'border-blue-100' },
      input: { label: '输入', bg: 'bg-green-50', text: 'text-green-600', border: 'border-green-100' },
      wait: { label: '等待', bg: 'bg-orange-50', text: 'text-orange-600', border: 'border-orange-100' },
      check: { label: '检查', bg: 'bg-purple-50', text: 'text-purple-600', border: 'border-purple-100' },
    };

    function AutomationUI() {
      // 模拟初始数据
      const [steps, setSteps] = useState([
        { id: 1, type: 'click', target: '登录按钮', value: null },
        { id: 2, type: 'input', target: '用户名输入框', value: 'testuser' },
        { id: 3, type: 'input', target: '密码输入框', value: '******' },
        { id: 4, type: 'click', target: '提交按钮', value: null },
        { id: 5, type: 'wait', target: null, value: '3秒' },
        { id: 6, type: 'check', target: '文字 "登录成功"', value: '存在' },
      ]);

      const [draggedItem, setDraggedItem] = useState(null);

      // 简单的拖拽排序逻辑
      const handleDragStart = (e, index) => {
        setDraggedItem(steps[index]);
        e.dataTransfer.effectAllowed = "move";
        // 使得拖拽时的幽灵图看起来透明一点
        e.target.style.opacity = '0.5';
      };

      const handleDragOver = (e, index) => {
        e.preventDefault();
        const draggedOverItem = steps[index];
        if (draggedItem === draggedOverItem) return;
        
        // 重新排序
        let newSteps = steps.filter(item => item !== draggedItem);
        newSteps.splice(index, 0, draggedItem);
        setSteps(newSteps);
      };

      const handleDragEnd = (e) => {
        setDraggedItem(null);
        e.target.style.opacity = '1';
      };

      return React.createElement('div', { className: "flex h-screen bg-gray-50 font-sans text-slate-800" },
        // 左侧：手机镜像区域
        React.createElement('div', { className: "w-[380px] bg-gray-900 p-6 flex flex-col items-center justify-center relative shadow-xl z-10" },
          React.createElement('div', { className: "text-white mb-4 text-sm font-medium opacity-70" }, "APPLE iPhone 15"),
          React.createElement('div', { className: "w-full h-[600px] bg-gray-800 rounded-[3rem] border-8 border-gray-700 shadow-2xl overflow-hidden relative" },
            React.createElement('div', { className: "absolute inset-0 bg-gradient-to-b from-blue-400 to-purple-500 opacity-20" }),
            React.createElement('div', { className: "absolute inset-0 flex items-center justify-center text-gray-500" },
              React.createElement('span', { className: "text-sm" }, "Screen Mirroring...")
            )
          )
        ),

        // 右侧：测试步骤编辑器
        React.createElement('div', { className: "flex-1 flex flex-col min-w-0" },
          // 顶部工具栏
          React.createElement('header', { className: "h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm z-20" },
            React.createElement('div', { className: "flex items-center gap-4" },
              React.createElement('h1', { className: "text-lg font-bold text-gray-800" }, "登录流程测试脚本"),
              React.createElement('span', { className: "px-2 py-0.5 rounded bg-green-100 text-green-700 text-xs font-semibold" }, "已保存")
            ),
            React.createElement('div', { className: "flex gap-3" },
              React.createElement('button', { className: "px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors" }, "录制"),
              React.createElement('button', { className: "px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 shadow-sm shadow-blue-200 flex items-center gap-2 transition-all" },
                React.createElement(Icons.Play), " 运行脚本"
              )
            )
          ),

          // 步骤列表区域
          React.createElement('main', { className: "flex-1 overflow-y-auto p-8" },
            React.createElement('div', { className: "max-w-4xl mx-auto" },
              React.createElement('div', { className: "mb-6 flex justify-between items-end" },
                React.createElement('div', null,
                  React.createElement('h2', { className: "text-xl font-bold text-gray-900" }, "测试步骤"),
                  React.createElement('p', { className: "text-gray-500 text-sm mt-1" }, "拖动左侧手柄可调整执行顺序")
                ),
                React.createElement('div', { className: "text-sm text-gray-400" }, `共 ${steps.length} 个步骤`)
              ),

              React.createElement('div', { className: "space-y-3" },
                steps.map((step, index) => {
                  const style = ACTION_STYLES[step.type] || ACTION_STYLES.click;
                  
                  return React.createElement('div', {
                    key: step.id,
                    draggable: true,
                    onDragStart: (e) => handleDragStart(e, index),
                    onDragOver: (e) => handleDragOver(e, index),
                    onDragEnd: handleDragEnd,
                    className: "group relative bg-white rounded-xl border border-gray-100 shadow-sm hover:shadow-md hover:border-blue-200 transition-all duration-200 p-1 flex items-center"
                  },
                    // 1. 拖拽手柄
                    React.createElement('div', { className: "w-10 h-14 flex items-center justify-center cursor-grab active:cursor-grabbing border-r border-gray-50 mr-3" },
                      React.createElement(Icons.Drag)
                    ),

                    // 2. 序号
                    React.createElement('div', { className: "text-xs font-mono text-gray-400 w-6 font-medium" },
                      (index + 1).toString().padStart(2, '0')
                    ),

                    // 3. 动作标签 (彩色胶囊)
                    React.createElement('div', { className: "w-16 flex-shrink-0 flex justify-center mr-4" },
                      React.createElement('span', { className: `${style.bg} ${style.text} ${style.border} border text-xs font-bold px-2.5 py-1 rounded-md min-w-[50px] text-center shadow-sm` },
                        style.label
                      )
                    ),

                    // 4. 详细内容区域
                    React.createElement('div', { className: "flex-1 text-sm text-gray-700 flex items-center gap-2 pr-4" },
                      step.target && React.createElement('span', { className: "font-semibold text-gray-900" }, step.target),
                      step.value && React.createElement(React.Fragment, null,
                        React.createElement('span', { className: "text-gray-400 text-xs" }, "Is"),
                        React.createElement('code', { className: "bg-gray-100 text-gray-600 px-2 py-0.5 rounded border border-gray-200 font-mono text-xs shadow-inner" },
                          step.value
                        )
                      )
                    ),

                    // 5. 悬浮操作栏
                    React.createElement('div', { className: "opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex gap-1 pr-3 border-l border-gray-50 pl-3" },
                      React.createElement('button', { className: "p-1.5 hover:bg-gray-100 rounded text-gray-500 hover:text-blue-600", title: "编辑" },
                        React.createElement(Icons.Edit)
                      ),
                      React.createElement('button', { className: "p-1.5 hover:bg-red-50 rounded text-gray-500 hover:text-red-600", title: "删除" },
                        React.createElement(Icons.Trash)
                      )
                    ),

                    // 正在运行指示器 (模拟效果)
                    index === 1 && React.createElement('div', { className: "absolute -left-[1px] top-3 bottom-3 w-1 bg-blue-500 rounded-r shadow-[0_0_10px_rgba(59,130,246,0.5)]" })
                  );
                })
              ),

              // 底部添加栏
              React.createElement('div', { className: "mt-4 relative group" },
                React.createElement('div', { className: "absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none" },
                  React.createElement(Icons.Plus, { className: "text-gray-400" })
                ),
                React.createElement('input', {
                  type: "text",
                  className: "block w-full pl-10 pr-3 py-3 border border-dashed border-gray-300 rounded-xl leading-5 bg-gray-50 text-gray-900 placeholder-gray-400 focus:outline-none focus:bg-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 sm:text-sm transition-all hover:bg-white hover:border-gray-400",
                  placeholder: "输入自然语言指令，AI 将自动生成步骤... (例如: 点击注册按钮)"
                }),
                React.createElement('div', { className: "absolute inset-y-0 right-0 flex items-center pr-2" },
                  React.createElement('button', { className: "p-1 bg-white border border-gray-200 rounded shadow-sm hover:bg-gray-50 text-xs text-gray-600 px-2" },
                    "Enter 发送"
                  )
                )
              )
            )
          )
        )
      );
    }

    // 渲染应用
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(AutomationUI));
  </script>
</body>
</html>
